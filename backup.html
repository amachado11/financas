<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Finanças Master Elite v34</title>
    <style>
        :root { --primaria: #007AFF; --ganho: #34C759; --gasto: #FF3B30; --fundo: #F2F2F7; --edicao: #FF9500; --lucro: #5856D6; --divida: #FF3B30; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, sans-serif; margin: 0; background: var(--fundo); height: 100vh; display: flex; flex-direction: column; color: #1c1c1e; }
        .header { background: white; padding: 15px 15px 10px 15px; border-bottom: 1px solid #ddd; text-align: center; font-weight: bold; flex-shrink: 0; }
        .conteudo { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 100px; }
        .aba { display: none; }
        .aba.ativa { display: block; }
        .card { background: white; padding: 15px; border-radius: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .aviso-recuperacao { background: #fff5f5; border: 2px solid #feb2b2; padding: 12px; border-radius: 12px; margin-bottom: 15px; font-size: 13px; color: #c53030; display: none; text-align: center; line-height: 1.4; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { border-color: #feb2b2; } 50% { border-color: #fc8181; } 100% { border-color: #feb2b2; } }
        .grid-resumo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .mini-card { background: white; padding: 12px; border-radius: 12px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        .mini-card span { font-size: 11px; color: #8e8e93; display: block; margin-bottom: 4px; }
        .mini-card b { font-size: 15px; }
        .stats-texto { font-size: 12px; color: #666; margin: 10px 0; line-height: 1.6; }
        .barra-cat-container { background: #eee; height: 6px; border-radius: 3px; margin: 8px 0 15px 0; overflow: hidden; }
        .barra-cat-preenchimento { height: 100%; border-radius: 3px; }
        .seletor-mes-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: #d1d1d6; border-radius: 12px; overflow: hidden; }
        .dia { background: white; min-height: 105px; padding: 5px; display: flex; flex-direction: column; }
        .dia.hoje { background: #f2f9ff; box-shadow: inset 0 0 0 2px var(--primaria); }
        .dia-n { font-weight: 700; color: #8e8e93; font-size: 11px; }
        .saldo-d { margin-top: auto; font-weight: 800; text-align: right; font-size: 11px; padding-top: 3px; border-top: 1px solid #f2f2f7; }
        .nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; height: 75px; border-top: 1px solid #d1d1d6; }
        .nav-btn { flex: 1; border: none; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; color: #8e8e93; }
        .nav-btn.ativo { color: var(--primaria); font-weight: bold; }
        input, select, button { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #d1d1d6; font-size: 16px; margin: 4px 0; }
        .btn-principal { background: var(--primaria); color: white; border: none; font-weight: bold; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f2f2f7; }
        .tag { font-size: 9px; padding: 2px 6px; border-radius: 5px; font-weight: 700; text-transform: uppercase; }
        .btn-acao { background: none; border: none; font-size: 18px; cursor: pointer; padding: 5px; width: auto; }
        .saldo-topo-geral { font-size: 13px; color: #666; margin-top: 4px; font-weight: 500; }
        .saldo-topo-geral span { font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    Finanças Master Elite
    <div class="saldo-topo-geral">SALDO ATUAL: <span id="saldo-geral-dinamico" style="color: var(--ganho);">R$ 0,00</span></div>
</div>

<div class="conteudo">
    <!-- ABA LANÇAR -->
    <div id="aba-add" class="aba ativa">
        <div class="card">
            <input type="hidden" id="edit-id">
            <input type="date" id="data">
            <input type="text" id="desc" placeholder="O que foi?">
            <input type="number" id="valor" placeholder="R$ 0,00" inputmode="decimal">
            <div style="display:flex; gap:8px">
                <select id="cat" style="flex:2">
                    <option value="Salário">💰 Ganho Uber/99</option>
                    <option value="Alimentação">🍕 Alimentação</option>
                    <option value="Transporte">🚗 Combustível/Manut.</option>
                    <option value="Contas">🏠 Contas Fixas</option>
                    <option value="Mercado">🛒 Mercado</option>
                    <option value="Outros">⚙️ Outros</option>
                </select>
                <select id="tipo" style="flex:1.2"><option value="gasto">(-) Saiu</option><option value="ganho">(+) Entrou</option></select>
            </div>
            <button class="btn-principal" id="btn-salvar" onclick="salvar()">Salvar Lançamento</button>
        </div>
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px">
                <strong>Histórico</strong>
                <input type="month" id="filtro-historico" style="width: auto; padding: 5px;" onchange="listar()">
            </div>
            <div id="lista"></div>
        </div>
    </div>

    <!-- ABA CALENDÁRIO -->
    <div id="aba-cal" class="aba">
        <div id="aviso-rec" class="aviso-recuperacao"></div>
        <div class="seletor-mes-container">
            <button onclick="mudarMes(-1)" style="border:none; background:none; font-size:24px">❮</button>
            <span id="mes-label" style="font-size:18px; font-weight:800"></span>
            <button onclick="mudarMes(1)" style="border:none; background:none; font-size:24px">❯</button>
        </div>
        <div style="display:grid; grid-template-columns: repeat(7, 1fr); text-align:center; font-size:10px; font-weight:bold; color:#8e8e93; margin-bottom:5px">
            <div>DOM</div><div>SEG</div><div>TER</div><div>QUA</div><div>QUI</div><div>SEX</div><div>SÁB</div>
        </div>
        <div class="grid" id="grid"></div>
    </div>

    <!-- ABA DÍVIDAS -->
    <div id="aba-dividas" class="aba">
        <div class="card">
            <strong id="divida-form-titulo" style="color: var(--divida);">💳 Cadastrar Nova Dívida</strong>
            <input type="hidden" id="divida-edit-id">
            <input type="text" id="divida-nome" placeholder="Nome (Ex: Empréstimo, Cartão)">
            
            <label style="font-size: 11px; color: #666; margin-top: 4px; display: block;">Valor Original (Valor Inicial):</label>
            <input type="number" id="divida-v-orig" placeholder="R$ 0,00" inputmode="decimal">
            
            <label style="font-size: 11px; color: #666; margin-top: 4px; display: block;">Valor Atual (Quanto a dívida está hoje):</label>
            <input type="number" id="divida-v-atual" placeholder="R$ 0,00" inputmode="decimal">
            
            <label style="font-size: 11px; color: #666; margin-top: 4px; display: block;">Data Inicial:</label>
            <input type="date" id="divida-data-ini">
            
            <button class="btn-principal" id="divida-btn-salvar" style="background: var(--divida); margin-top: 10px;" onclick="salvarDivida()">Cadastrar Dívida</button>
            <button id="divida-btn-cancelar" style="display:none; background:#8e8e93; color:white; border:none; font-weight:bold;" onclick="resetFormDivida()">Cancelar Edição</button>
        </div>
        <div class="card">
            <div id="divida-total" style="margin-bottom: 10px; font-weight: bold; color: var(--divida);"></div>
            <div id="divida-lista"></div>
        </div>
    </div>

    <!-- ABA RELATÓRIO -->
    <div id="aba-rel" class="aba">
        <div class="card"><input type="month" id="rel-mes" onchange="gerarRel()"></div>
        <div class="grid-resumo" id="resumo-topo"></div>
        <div class="card"><div id="stats-detalhe" class="stats-texto"></div></div>
        <div class="card">
            <strong>Gastos por Categoria</strong><br><br>
            <div id="cat-lista"></div>
        </div>
    </div>
</div>

<!-- NAVEGAÇÃO INFERIOR -->
<div class="nav">
    <button class="nav-btn ativo" onclick="ir('add', this)">➕<br>Lançar</button>
    <button class="nav-btn" onclick="ir('cal', this)">📅<br>Calendário</button>
    <button class="nav-btn" onclick="ir('dividas', this)">💳<br>Dívidas</button>
    <button class="nav-btn" onclick="ir('rel', this)">📊<br>Análise</button>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('financas_v_final')) || [];
    let dividas = JSON.parse(localStorage.getItem('financas_dividas')) || [];
    let dataRef = new Date();
    const coresCat = {'Alimentação': '#FF9500', 'Transporte': '#5AC8FA', 'Contas': '#FF3B30', 'Mercado': '#FFCC00', 'Salário': '#34C759', 'Outros': '#8E8E93'};

    function atualizarSaldoGeral() {
        const hoje = new Date();
        hoje.setHours(0,0,0,0);

        const anoAtual = hoje.getFullYear();
        const mesAtual = hoje.getMonth();

        let saldoCalculado = 0;
        db.forEach(i => { 
            if(new Date(i.data + "T00:00:00") < new Date(anoAtual, mesAtual, 1)) {
                saldoCalculado += (i.tipo=='ganho' ? i.valor : -i.valor); 
            }
        });

        const diaAtualDoMes = hoje.getDate();
        for(let d = 1; d <= diaAtualDoMes; d++) {
            const dI = `${anoAtual}-${String(mesAtual+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            db.filter(x => x.data === dI).forEach(i => { 
                if(i.tipo == 'ganho') saldoCalculado += i.valor; 
                else saldoCalculado -= i.valor; 
            });
        }

        const el = document.getElementById('saldo-geral-dinamico');
        if (el) {
            el.innerText = `R$ ${saldoCalculado.toLocaleString('pt-br', {minimumFractionDigits: 2})}`;
            el.style.color = saldoCalculado >= 0 ? 'var(--ganho)' : 'var(--gasto)';
        }
    }

    function ir(aba, btn) {
        document.querySelectorAll('.aba').forEach(a => a.classList.remove('ativa'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('ativo'));
        document.getElementById('aba-' + aba).classList.add('ativa');
        btn.classList.add('ativo');
        if(aba === 'cal') render();
        if(aba === 'add') listar();
        if(aba === 'dividas') listarDividas();
        if(aba === 'rel') gerarRel();
        atualizarSaldoGeral();
    }

    function mudarMes(n) { dataRef.setMonth(dataRef.getMonth() + n); render(); }

    function salvar() {
        const id = document.getElementById('edit-id').value;
        const d = document.getElementById('data').value, v = parseFloat(document.getElementById('valor').value);
        if(!d || isNaN(v)) return alert("Preencha data e valor!");

        const novo = { id: id ? parseInt(id) : Date.now(), data: d, desc: document.getElementById('desc').value || 'S/N', valor: v, tipo: document.getElementById('tipo').value, cat: document.getElementById('cat').value };

        if(id) db = db.map(i => i.id == id ? novo : i);
        else db.push(novo);

        localStorage.setItem('financas_v_final', JSON.stringify(db));
        resetForm(); listar(); render(); atualizarSaldoGeral();
    }

    function resetForm() {
        document.getElementById('edit-id').value = "";
        document.getElementById('desc').value = "";
        document.getElementById('valor').value = "";
        document.getElementById('btn-salvar').innerText = "Salvar Lançamento";
        document.getElementById('btn-salvar').style.background = "var(--primaria)";
    }

    function editar(id) {
        const i = db.find(x => x.id == id);
        document.getElementById('edit-id').value = i.id;
        document.getElementById('data').value = i.data;
        document.getElementById('desc').value = i.desc;
        document.getElementById('valor').value = i.valor;
        document.getElementById('tipo').value = i.tipo;
        document.getElementById('cat').value = i.cat;
        document.getElementById('btn-salvar').innerText = "Atualizar Item";
        document.getElementById('btn-salvar').style.background = "var(--edicao)";
        window.scrollTo(0,0);
    }

    function listar() {
        const l = document.getElementById('lista'), mesF = document.getElementById('filtro-historico').value;
        l.innerHTML = "";
        db.filter(i => i.data.startsWith(mesF)).sort((a,b) => b.data.localeCompare(a.data)).forEach(i => {
            const partesData = i.data.split('-');
            const dataFormatada = partesData.length === 3 ? `${partesData[2]}/${partesData[1]}` : '';

            l.innerHTML += `<div class="item">
                <div>
                    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 3px;">
                        <span class="tag" style="background:${coresCat[i.cat]}22; color:${coresCat[i.cat]}">${i.cat}</span>
                        <small style="color: #8e8e93; font-weight: 500;">${dataFormatada}</small>
                    </div>
                    <b>${i.desc}</b><br>
                    <small style="color:${i.tipo=='ganho'?'green':'red'}">R$ ${i.valor.toFixed(2)}</small>
                </div>
                <div>
                    <button class="btn-acao" onclick="editar(${i.id})">✏️</button>
                    <button class="btn-acao" onclick="excluir(${i.id})">🗑️</button>
                </div>
            </div>`;
        });
        atualizarSaldoGeral();
    }

    function excluir(id) { if(confirm("Apagar?")) { db = db.filter(i => i.id != id); localStorage.setItem('financas_v_final', JSON.stringify(db)); listar(); render(); atualizarSaldoGeral(); } }

    /* FUNÇÕES DA ABA DÍVIDAS */
    function calcularTempoDecorrido(dataInicialStr) {
        if (!dataInicialStr) return '0 dias';
        const ini = new Date(dataInicialStr + 'T00:00:00');
        const hoje = new Date();
        hoje.setHours(0,0,0,0);

        if (ini > hoje) return 'Data futura';

        let anos = hoje.getFullYear() - ini.getFullYear();
        let meses = hoje.getMonth() - ini.getMonth();
        let dias = hoje.getDate() - ini.getDate();

        if (dias < 0) {
            meses--;
            const prevMonth = new Date(hoje.getFullYear(), hoje.getMonth(), 0).getDate();
            dias += prevMonth;
        }
        if (meses < 0) {
            anos--;
            meses += 12;
        }

        let partes = [];
        if (anos > 0) partes.push(`${anos} ${anos === 1 ? 'ano' : 'anos'}`);
        if (meses > 0) partes.push(`${meses} ${meses === 1 ? 'mês' : 'meses'}`);
        if (dias > 0 || partes.length === 0) partes.push(`${dias} ${dias === 1 ? 'dia' : 'dias'}`);

        return partes.join(' e ');
    }

    function salvarDivida() {
        const id = document.getElementById('divida-edit-id').value;
        const nome = document.getElementById('divida-nome').value;
        const vOrig = parseFloat(document.getElementById('divida-v-orig').value);
        const vAtual = parseFloat(document.getElementById('divida-v-atual').value);
        const dtIni = document.getElementById('divida-data-ini').value;

        if(!nome || isNaN(vOrig) || isNaN(vAtual) || !dtIni) return alert("Preencha todos os campos da dívida!");

        const novaDivida = {
            id: id ? parseInt(id) : Date.now(),
            nome,
            valorOriginal: vOrig,
            valorAtual: vAtual,
            dataInicial: dtIni
        };

        if(id) {
            dividas = dividas.map(d => d.id == id ? novaDivida : d);
        } else {
            dividas.push(novaDivida);
        }

        localStorage.setItem('financas_dividas', JSON.stringify(dividas));
        resetFormDivida();
        listarDividas();
    }

    function resetFormDivida() {
        document.getElementById('divida-edit-id').value = "";
        document.getElementById('divida-nome').value = "";
        document.getElementById('divida-v-orig').value = "";
        document.getElementById('divida-v-atual').value = "";
        document.getElementById('divida-data-ini').valueAsDate = new Date();
        
        document.getElementById('divida-form-titulo').innerText = "💳 Cadastrar Nova Dívida";
        document.getElementById('divida-btn-salvar').innerText = "Cadastrar Dívida";
        document.getElementById('divida-btn-salvar').style.background = "var(--divida)";
        document.getElementById('divida-btn-cancelar').style.display = "none";
    }

    function editarDivida(id) {
        const d = dividas.find(x => x.id == id);
        if(!d) return;

        document.getElementById('divida-edit-id').value = d.id;
        document.getElementById('divida-nome').value = d.nome;
        document.getElementById('divida-v-orig').value = d.valorOriginal;
        document.getElementById('divida-v-atual').value = d.valorAtual;
        document.getElementById('divida-data-ini').value = d.dataInicial;

        document.getElementById('divida-form-titulo').innerText = "✏️ Editar Dívida";
        document.getElementById('divida-btn-salvar').innerText = "Atualizar Dívida";
        document.getElementById('divida-btn-salvar').style.background = "var(--edicao)";
        document.getElementById('divida-btn-cancelar').style.display = "block";

        window.scrollTo(0,0);
    }

    
                <div style="font-size: 12px; color: #444; width: 100%;">
                    Valor Original: <b>R$ ${d.valorOriginal.toFixed(2)}</b> | Valor Atual: <b style="color: var(--divida);">R$ ${d.valorAtual.toFixed(2)}</b>
                </div>

                <div style="font-size: 11px; width: 100%; display: flex; flex-direction: column; gap: 2px;">
                    <span style="color: #666;">🗓️ Início: <b>${dataFormatada}</b> (⏱️ ${tempoDecorrido})</span>
                    ${juros > 0 
                        ? `<span style="color: var(--gasto); font-weight: bold;">📈 Juros/Acréscimos: +R$ ${juros.toFixed(2)} (${((juros/d.valorOriginal)*100).toFixed(1)}%)</span>` 
                        : `<span style="color: var(--ganho); font-weight: 500;">📉 Redução do saldo: -R$ ${Math.abs(juros).toFixed(2)}</span>`}
                </div>
            </div>`;
        })
function listarDividas() {
        const l = document.getElementById('divida-lista'), t = document.getElementById('divida-total');
        l.innerHTML = ""; let somaAtual = 0; let somaOriginal = 0; let somaJurosTotal = 0;

        dividas.forEach(d => {
            somaAtual += d.valorAtual;
            somaOriginal += d.valorOriginal;

            const partesData = d.dataInicial.split('-');
            const dataFormatada = partesData.length === 3 ? `${partesData[2]}/${partesData[1]}/${partesData[0]}` : d.dataInicial;
            const tempoDecorrido = calcularTempoDecorrido(d.dataInicial);
            
            // Juros = Valor Atual - Valor Original
            const juros = d.valorAtual - d.valorOriginal;
            if(juros > 0) somaJurosTotal += juros;

            l.innerHTML += `<div class="item" style="flex-direction: column; align-items: flex-start; gap: 6px;">
                <div style="display: flex; justify-content: space-between; width: 100%;">
                    <b>${d.nome}</b>
                    <div>
                        <button class="btn-acao" onclick="editarDivida(${d.id})" title="Editar">✏️</button>
                        <button class="btn-acao" onclick="excluirDivida(${d.id})" title="Excluir">🗑️</button>
                    </div>
                </div>
                
                <div style="font-size: 12px; color: #444; width: 100%;">
                    Valor Original: <b>R$ ${d.valorOriginal.toFixed(2)}</b> | Valor Atual: <b style="color: var(--divida);">R$ ${d.valorAtual.toFixed(2)}</b>
                </div>

                <div style="font-size: 11px; width: 100%; display: flex; flex-direction: column; gap: 2px;">
                    <span style="color: #666;">🗓️ Início: <b>${dataFormatada}</b> (⏱️ ${tempoDecorrido})</span>
                    ${juros > 0 
                        ? `<span style="color: var(--gasto); font-weight: bold;">📈 Juros/Acréscimos: +R$ ${juros.toFixed(2)} (${((juros/d.valorOriginal)*100).toFixed(1)}%)</span>` 
                        : `<span style="color: var(--ganho); font-weight: 500;">📉 Redução do saldo: -R$ ${Math.abs(juros).toFixed(2)}</span>`}
                </div>
            </div>`;
        });

        t.innerHTML = `Total Atual: <b style="color: var(--divida);">R$ ${somaAtual.toFixed(2)}</b> 
        <br><small style="color: #666; font-weight: normal;">Original: R$ ${somaOriginal.toFixed(2)} | Juros Acumulados: R$ ${somaJurosTotal.toFixed(2)}</small>`;
    }

    function excluirDivida(id) {
        if(confirm("Remover esta dívida da lista?")) {
            dividas = dividas.filter(d => d.id !== id);
            localStorage.setItem('financas_dividas', JSON.stringify(dividas));
            listarDividas();
        }
    }

    function render() {
        const g = document.getElementById('grid'), label = document.getElementById('mes-label'), aviso = document.getElementById('aviso-rec');
        const ano = dataRef.getFullYear(), mes = dataRef.getMonth();
        label.innerText = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"][mes] + " " + ano;
        g.innerHTML = "";
        const hoje = new Date(); hoje.setHours(0,0,0,0);
        let sReal = 0;
        db.forEach(i => { if(new Date(i.data + "T00:00:00") < hoje) sReal += (i.tipo=='ganho' ? i.valor : -i.valor); });
        let dPerigo = null, vFaltante = 0, sAcu = sReal;
        for (let i = 0; i <= 60; i++) {
            let dCheck = new Date(hoje); dCheck.setDate(hoje.getDate() + i);
            let dCheckIso = dCheck.toLocaleDateString('sv-SE');
            db.filter(x => x.data === dCheckIso).forEach(l => { sAcu += (l.tipo == 'ganho' ? l.valor : -l.valor); });
            if (sAcu < 0) { dPerigo = new Date(dCheck); vFaltante = Math.abs(sAcu); break; }
        }
        if (dPerigo) {
            const diff = Math.round((dPerigo - hoje) / (1000 * 60 * 60 * 24));
            aviso.style.display = "block";
            if (diff > 0) aviso.innerHTML = `⚠️ <b>Radar:</b> Saldo negativo em ${dPerigo.getDate()}/${dPerigo.getMonth()+1}.<br>Faltam <b>${diff} dias</b>. Meta: <b>R$ ${(vFaltante/diff).toFixed(2)} / dia</b>.`;
            else aviso.innerHTML = `⚠️ <b>Atenção:</b> Você está no vermelho (R$ ${vFaltante.toFixed(2)}).`;
        } else aviso.style.display = "none";
        let sMes = 0;
        db.forEach(i => { if(new Date(i.data + "T00:00:00") < new Date(ano, mes, 1)) sMes += (i.tipo=='ganho' ? i.valor : -i.valor); });
        const inicio = new Date(ano, mes, 1).getDay(), fim = new Date(ano, mes + 1, 0).getDate();
        for(let i=0; i<inicio; i++) g.innerHTML += `<div class="dia" style="background:#f2f2f7"></div>`;
        for(let d=1; d<=fim; d++) {
            const dI = `${ano}-${String(mes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            let gan = 0, gas = 0;
            db.filter(x => x.data === dI).forEach(i => { if(i.tipo == 'ganho') gan += i.valor; else gas += i.valor; });
            sMes += (gan - gas);
            g.innerHTML += `<div class="dia ${dI==hoje.toLocaleDateString('sv-SE')?'hoje':''}">
                <span class="dia-n">${d}</span>
                <div style="font-size:9px; color:var(--ganho)">${gan>0?'R$ '+gan.toFixed(0):''}</div>
                <div style="font-size:9px; color:var(--gasto)">${gas>0?'R$ '+gas.toFixed(0):''}</div>
                <div class="saldo-d" style="color:${sMes>=0?'var(--ganho)':'var(--gasto)'}">R$ ${sMes.toFixed(0)}</div>
            </div>`;
        }
    }

    function gerarRel() {
        const m = document.getElementById('rel-mes').value, filtrados = db.filter(it => it.data.startsWith(m));
        let gT=0, sT=0, cats = {};
        filtrados.forEach(it => { if(it.tipo==='ganho') gT+=it.valor; else { sT+=it.valor; cats[it.cat]=(cats[it.cat]||0)+it.valor; } });
        document.getElementById('resumo-topo').innerHTML = `<div class="mini-card"><span>Ganhos</span><b style="color:var(--ganho)">R$ ${gT.toFixed(2)}</b></div><div class="mini-card"><span>Gastos</span><b style="color:var(--gasto)">R$ ${sT.toFixed(2)}</b></div>`;
        const hoje = new Date(), anoRel = m.split('-')[0], mesRel = m.split('-')[1], ultDia = new Date(anoRel, mesRel, 0).getDate();
        const diaA = (m === hoje.toLocaleDateString('sv-SE').substring(0,7)) ? hoje.getDate() : ultDia;
        const media = sT / diaA;
        document.getElementById('stats-detalhe').innerHTML = `Média Diária: <b>R$ ${media.toFixed(2)}</b><br>Projeção Mensal: <b style="color:var(--gasto)">R$ ${(media * ultDia).toFixed(2)}</b>`;
        const cl = document.getElementById('cat-lista'); cl.innerHTML = "";
        Object.entries(cats).sort((a,b)=>b[1]-a[1]).forEach(([c, v]) => {
            const perc = (v / sT * 100).toFixed(0);
            cl.innerHTML += `<div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:2px"><span>${c}</span><span>R$ ${v.toFixed(2)} (${perc}%)</span></div><div class="barra-cat-container"><div class="barra-cat-preenchimento" style="width:${perc}%; background:${coresCat[c] || '#8E8E93'}"></div></div>`;
        });
    }

    window.onload = () => { 
        document.getElementById('data').valueAsDate = new Date();
        document.getElementById('divida-data-ini').valueAsDate = new Date();
        const m = new Date().toLocaleDateString('sv-SE').substring(0,7);
        document.getElementById('filtro-historico').value = m;
        document.getElementById('rel-mes').value = m;
        listar(); render();
    };
</script>
</body>
</html>
